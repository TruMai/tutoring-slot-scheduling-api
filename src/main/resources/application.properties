spring.application.name=tutoring-app

# SQLite datasource (DB_PATH is set by Docker, defaults to tutoring.db locally)
spring.datasource.url=jdbc:sqlite:${DB_PATH:tutoring.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# Initialization settings
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql

# Disable Hibernate
spring.jpa.hibernate.ddl-auto=none

# Notification gateway and mock stub on/off switch
notification.base-url=http://localhost:8080
notification.mock.down=false

# Gemini free tier
spring.ai.google.genai.api-key=${GEMINI_API_KEY:missing-key}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:missing-key}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001

# Agent 2 (reminders)
reminder.cron=0 0 * * * *
reminder.window-hours=24

