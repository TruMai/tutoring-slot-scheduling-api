<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Available Slots</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4">Available Tutoring Slots</h2>
        
        <!-- Filter Form -->
        <form class="row g-3 mb-4" method="get" action="/slots">
            <div class="col-auto">
                <input type="text" class="form-control" name="subject" placeholder="Filter by subject...">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-secondary">Filter</button>
            </div>
        </form>

        <!-- Slots Table -->
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Subject</th>
                            <th>Time</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Example row looping via Thymeleaf -->
                        <tr th:each="slot : ${slots}">
                            <td th:text="${slot.id}">1</td>
                            <td th:text="${slot.subject}">Computer Science</td>
                            <td th:text="${slot.time}">2:00 PM - 3:00 PM</td>
                            <td>
                                <a th:href="@{/slots/{id}/book(id=${slot.id})}" class="btn btn-sm btn-primary">Book</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
