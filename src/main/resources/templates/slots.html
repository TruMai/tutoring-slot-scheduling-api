<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Available Slots</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    
    <div class="container mt-5">
        <h2 class="mb-4">Available Tutoring Slots</h2>
        
        <!-- Filter Form -->
        <form class="row g-3 mb-4" method="get" action="/slots">
            <div class="col-auto">
                <input type="number" class="form-control" name="providerId" placeholder="Provider ID" th:value="${providerId}">
            </div>
            <div>
                <input type="number" class="form-control" name="serviceId" placeholder="Service ID" th:value="${serviceId}">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-secondary">Filter</button>
            </div>
        </form>

        <!-- Slots Table -->
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tutor</th>
                            <th>Service</th>
                            <th>Price</th>
                            <th>Duration</th>
                            <th>Start</th>
                            <th>End</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Example row looping via Thymeleaf -->
                        <tr th:each="slot : ${slots}">
                            <td th:text="${slot.id}">1</td>
                            <td th:text="${slot.providerName}">Tutor</td>
                            <td th:text="${slot.serviceName}">Session</td>
                            <td th:text="${'$' + #numbers.formatDecimal(slot.price, 1, 2)}">$20.00</td>
                            <td th:text="${slot.durationMin + ' min'}">30 min</td>
                            <td th:text="${#strings.replace(slot.startAt, 'T', ' ')}">start</td>
                            <td th:text="${#strings.replace(slot.endAt, 'T', ' ')}">end</td>
                            <td>
                                <a th:href="@{/slots/{id}/book(id=${slot.id})}" class="btn btn-sm btn-primary">Book</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(slots)}">
                            <td colspan="8" class="text-center text-muted">No available slots.</td>
                        </tr>
                    </tbody>
                </table>

                <!-- Show 20 Slots at a time with prev and next button> -->
                <div class="d-flex justify-content-between">
                    <a class="btn btn-outline-secondary btn-sm" th:if="${page > 0}"
                       th:href="@{/slots(page=${page - 1}, providerId=${providerId}, serviceId=${serviceId})}">Previous</a>
                    <span></span>
                    <a class="btn btn-outline-secondary btn-sm" th:if="${#lists.size(slots) == 20}"
                       th:href="@{/slots(page=${page + 1}, providerId=${providerId}, serviceId=${serviceId})}">Next</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
