<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Booking Confirmed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container text-center mt-5" style="max-width: 500px;">
        <div class="card shadow-sm p-4">
            <div class="card-body">
                <h2 class="text-success mb-3">Booking Successful! 🎉</h2>
                <p class="text-muted mb-4">Your appointment has been successfully scheduled.</p>
                
                <div class="alert alert-light border text-start">
                    <p class="mb-1"><strong>Appointment ID:</strong> <span th:text="${appointment.id}">42</span></p>
                    <p class="mb-0"><strong>Status:</strong> Confirmed</p>
                </div>

                <a href="/slots" class="btn btn-primary w-100 mt-3">Back to Available Slots</a>
            </div>
        </div>
    </div>
</body>
</html>
