<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Appointment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 500px;">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-4">Confirm Your Booking</h3>
                
                <div class="mb-3">
                    <label class="form-label text-muted">Selected Slot ID:</label>
                    <p class="fw-bold" th:text="${slot.id}">1</p>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted">Subject & Details:</label>
                    <p class="fw-bold" th:text="${slot.subject}">Computer Science</p>
                </div>

                <form action="/book" method="post">
                    <input type="hidden" name="slotId" th:value="${slot.id}">
                    <button type="submit" class="btn btn-success w-100">Booking Confirmed</button>
                </form>
                
                <div class="text-center mt-3">
                    <a href="/slots" class="text-decoration-none text-muted">Cancel & Go Back</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
