<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Appointment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 500px;">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-4">Confirm Your Booking</h3>

                <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

                <dl>
                    <dt class="text-muted">Tutor</dt><dd class="fw-bold" th:text="${slot.providerName}">Tutor</dd>
                    <dt class="text-muted">Service</dt><dd class="fw-bold" th:text="${slot.serviceName}">Session</dd>
                    <dt class="text-muted">Price</dt><dd class="fw-bold" th:text="${'$' + #numbers.formatDecimal(slot.price, 1, 2)}">$20.00</dd>
                    <dt class="text-muted">When</dt>
                    <dd class="fw-bold" th:text="${#strings.replace(slot.startAt, 'T', ' ') + ' – ' + #strings.replace(slot.endAt, 'T', ' ')}">time</dd>
                </dl>

                <form th:action="@{/book}" method="post">
                    <input type="hidden" name="slotId" th:value="${slot.id}">
                    <button type="submit" class="btn btn-success w-100">Confirm Booking</button>
                </form>

                <div class="text-center mt-3">
                    <a href="/slots" class="text-decoration-none text-muted">Cancel &amp; Go Back</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
