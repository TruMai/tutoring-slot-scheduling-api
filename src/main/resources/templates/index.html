<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tutoring Service - Home</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">CMPE 172 Tutoring</a>
            <div class="navbar-nav ms-auto align-items-center">
                <a class="nav-link active" href="/">Home</a>
                <a class="nav-link" href="/slots">Browse Slots</a>
                <a class="nav-link" th:if="${session.USERNAME == null}" href="/login">Login</a>
                <span class="navbar-text mx-2" th:if="${session.USERNAME != null}" th:text="${session.USERNAME}">user</span>
                <button class="btn btn-sm btn-outline-light" th:if="${session.USERNAME != null}" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="container my-5">
        <div class="p-5 mb-4 bg-white rounded-3 shadow-sm border">
            <div class="container-fluid py-5">
                <h1 class="display-5 fw-bold text-primary">Welcome to the Tutoring Platform</h1>
                <p class="col-md-8 fs-4 text-muted">
                    Milestone 2 UI Template. Browse available tutoring slots, schedule appointments, and manage sessions.
                </p>
                <a href="/slots" class="btn btn-primary btn-lg mt-3" type="button">Browse Available Slots</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
